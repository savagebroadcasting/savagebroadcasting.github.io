<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBC Operations</title>
<style>
  :root{--bg:#0f1c2e;--panel:#152538;--line:#1e3247;--teal:#00b4a6;--ink:#e8edf2;--dim:#8aa0b2}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);margin:0}
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:99}
  #gate h1{color:var(--teal);margin:0}
  #gate input{font-size:22px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-align:center;width:160px}
  #gate .err{color:#f08a8a;height:18px;font-size:14px}
  header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
  header h1{color:var(--teal);margin:0;font-size:22px}
  .stamp{color:var(--dim);font-size:12px}
  nav{display:flex;gap:6px;padding:10px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  nav button{background:var(--panel);color:var(--dim);border:1px solid var(--line);padding:7px 14px;border-radius:20px;cursor:pointer;font-size:14px}
  nav button.on{background:var(--teal);color:#03121a;border-color:var(--teal);font-weight:600}
  main{padding:18px 20px;max-width:1100px;margin:0 auto}
  .tab{display:none}.tab.on{display:block}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:20px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .stat .n{font-size:30px;color:var(--teal);font-weight:700}
  .stat .l{color:var(--dim);font-size:13px;margin-top:2px}
  .bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
  .bar>i{display:block;height:100%;background:var(--teal)}
  .bar>i.hot{background:#f0a05a}.bar>i.crit{background:#f08a8a}
  h2{color:var(--teal);font-size:16px;border-bottom:1px solid var(--line);padding-bottom:6px;margin:26px 0 12px}
  .hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:22px}
  .big{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 14px;text-align:center}
  .big .n{font-size:42px;line-height:1;color:var(--teal);font-weight:800}
  .big .l{color:var(--dim);font-size:13px;margin-top:7px}
  .big .sub{color:var(--ink);font-size:11px;opacity:.65;margin-top:4px;line-height:1.3}
  .acc{border:1px solid var(--line);border-radius:10px;margin-bottom:9px;overflow:hidden}
  .acc>h4{margin:0;padding:13px 15px;background:var(--panel);cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:15px;user-select:none;font-weight:600}
  .acc>h4 .r{display:flex;gap:10px;align-items:center}
  .acc>h4 .cnt{background:var(--teal);color:#03121a;border-radius:12px;padding:1px 11px;font-weight:700;font-size:13px}
  .acc>h4 .cnt.zero{background:var(--line);color:var(--dim)}
  .acc>h4 .arw{transition:transform .15s;color:var(--dim);font-size:12px}
  .acc.open>h4 .arw{transform:rotate(90deg)}
  .acc .body{display:none;padding:10px 12px;border-top:1px solid var(--line)}
  .acc.open .body{display:block}
  .gauge{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:18px}
  .gauge .top{display:flex;justify-content:space-between;align-items:baseline}
  .gauge .lab{font-weight:600;font-size:15px}
  .gauge .val{font-size:30px;font-weight:800;color:var(--teal)}
  .gauge .track{height:14px;background:var(--line);border-radius:7px;overflow:hidden;margin:9px 0 6px}
  .gauge .track>i{display:block;height:100%;border-radius:7px;background:var(--teal)}
  .gauge .track>i.hot{background:#f0a05a}.gauge .track>i.crit{background:#f08a8a}
  .gauge .note{color:var(--dim);font-size:12px}
  .clik{cursor:pointer}.clik:hover{border-color:var(--teal)}
  .clik .mag{position:absolute;top:8px;right:11px;color:var(--dim);font-size:12px}
  .big{position:relative}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:38px 14px;overflow:auto}
  #modal.on{display:flex}
  #modal .box{background:var(--panel);border:1px solid var(--teal);border-radius:12px;max-width:580px;width:100%;padding:18px 20px}
  #modal .box h3{margin:0 0 4px;color:var(--teal)}
  #modal .box .sub{color:var(--dim);font-size:13px;margin-bottom:12px}
  #modal .box .x{float:right;cursor:pointer;color:var(--dim);font-size:22px;line-height:1}
  #modal ul{list-style:none;padding:0;margin:0;max-height:62vh;overflow:auto}
  #modal li{padding:6px 9px;border-bottom:1px solid var(--line);font-size:14px}
  #modal li:nth-child(odd){background:#0f2033}
  .kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:80px}
  .col h3{margin:0 0 8px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between}
  .col h3 span{color:var(--teal)}
  .set{background:#0f2033;border:1px solid var(--line);border-radius:7px;padding:7px 9px;margin-bottom:7px;font-size:12.5px;line-height:1.3}
  .set .rip{color:var(--dim);font-size:11px}
  .set .mt{color:var(--teal);font-size:11px}
  ul.plain{list-style:none;padding:0;margin:0}
  ul.plain li{background:var(--panel);border:1px solid var(--line);border-left:3px solid #f0a05a;border-radius:6px;padding:8px 12px;margin-bottom:7px;font-size:14px}
  .muted{color:var(--dim);font-size:13px}
  .now{background:#152538;border:1px solid var(--teal);border-radius:10px;padding:12px 14px;margin-bottom:18px}
  .now b{color:var(--teal)}
  .qgroup{margin-bottom:18px}
  .qgroup h3{color:var(--ink);font-size:15px;margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
  ul.q{list-style:none;padding:0;margin:0}
  ul.q li{padding:6px 0 6px 26px;position:relative;font-size:14px;line-height:1.35;border-bottom:1px solid #12212f}
  ul.q li .m{position:absolute;left:0;top:6px;font-size:13px}
  .s-done{color:#6fbf8f}.s-prog{color:#f0c05a}.s-queued{color:var(--dim)}.s-you{color:#f08a8a}.s-flagged{color:#f0a05a}
  .legend{color:var(--dim);font-size:12px;margin:0 0 16px}
  .legend span{margin-right:12px;white-space:nowrap}
  @media(max-width:720px){.kanban{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<div id="gate"><h1>Savage Broadcasting Co. — Ops</h1><input id="pw" type="password" placeholder="password" autofocus><div class="err" id="pwerr"></div></div>
<div id="modal" onclick="if(event.target.id==='modal')this.classList.remove('on')"><div class="box"><span class="x" onclick="document.getElementById('modal').classList.remove('on')">✕</span><h3 id="mTitle"></h3><div class="sub" id="mSub"></div><ul id="mList"></ul></div></div>

<header><h1>SBC Operations</h1><span class="stamp" id="stamp">loading…</span></header>
<nav>
  <button class="on" data-tab="overview">Overview</button>
  <button data-tab="queue">My Queue</button>
  <button data-tab="wrestling">Wrestling / SWN</button>
  <button data-tab="tv">TV</button>
  <button data-tab="movies">Movies</button>
  <button data-tab="resale">Resale</button>
</nav>
<main>
  <section class="tab on" id="overview"></section>
  <section class="tab" id="queue"></section>
  <section class="tab" id="wrestling"></section>
  <section class="tab" id="tv"><p class="muted">TV pipeline board — coming in v2.</p></section>
  <section class="tab" id="movies"><p class="muted">Movies pipeline board — coming in v2.</p></section>
  <section class="tab" id="resale"><p class="muted">Resale (Keep / Sell / Sold + pricing) — coming in v3.</p></section>
</main>

<script>
const PW="1111";
document.getElementById('pw').addEventListener('keyup',e=>{
  if(e.key==='Enter'){ if(e.target.value===PW){document.getElementById('gate').style.display='none';load();}
    else{document.getElementById('pwerr').textContent='Nope, try again.';e.target.value='';} }
});
function bar(pct){const c=pct>=90?'crit':pct>=80?'hot':'';return `<div class="bar"><i class="${c}" style="width:${pct}%"></i></div>`;}
function gauge(label,score,note){const s=score||1,pct=s*10,cls=s>=8?'crit':s>=5?'hot':'';return `<div class="gauge"><div class="top"><span class="lab">${label}</span><span class="val">${s}<span style="font-size:15px;color:var(--dim)">/10</span></span></div><div class="track"><i class="${cls}" style="width:${pct}%"></i></div><div class="note">${note||''}</div></div>`;}
function drill(period){const list=(window._lists||{})[period]||[];const names={today:'Discs ripped today',week:'Discs ripped this week',month:'Discs ripped this month',alltime:'All discs ripped (logged)'};document.getElementById('mTitle').textContent=names[period]||'Discs';document.getElementById('mSub').textContent=list.length+' discs';document.getElementById('mList').innerHTML=list.length?list.map(x=>`<li>${x}</li>`).join(''):'<li>Nothing logged for this period.</li>';document.getElementById('modal').classList.add('on');}
async function load(){
  let d; try{ d=await (await fetch('dashboard-data.json?_='+Date.now())).json(); }catch(e){ return; }
  document.getElementById('stamp').textContent='updated '+d.generated;
  const w=d.wrestling, c=w.counts, st=d.stats||{}, order=d.stage_order||['Purchased','Ripped','Scanned','Encoding','Filed','Certified'];
  const bt=st.titles_by_type||{}, wl=st.workload||{overall:1,note:''};
  window._lists={today:st.discs_today_list||[], week:st.discs_week_list||[], month:st.discs_month_list||[], alltime:st.discs_alltime_list||[]};
  // Overview
  document.getElementById('overview').innerHTML=`
    ${gauge('Work on Claude&#39;s plate right now', wl.overall, wl.note)}
    <div class="hero">
      <div class="big"><div class="n">${(st.episodes_matches||0).toLocaleString()}</div><div class="l">episodes &amp; matches in Plex</div></div>
      <div class="big"><div class="n">${st.titles_total||0}</div><div class="l">titles in the collection</div><div class="sub">${bt.TV||0} TV · ${bt.Movies||0} movies · ${bt.Wrestling||0} wrestling · ${bt['Blu-ray']||0} Blu-ray</div></div>
      <div class="big"><div class="n">${st.certified||0}<span style="font-size:20px;color:var(--dim)"> / ~${st.certified_estimate||0}</span></div><div class="l">seasons certified</div><div class="sub">across ${st.certified_shows||0} shows · climbing</div></div>
    </div>
    <h2>Discs ripped <span style="font-size:12px;color:var(--dim);font-weight:400">— tap a number to see the list</span></h2>
    <div class="hero">
      <div class="big clik" onclick="drill('today')"><span class="mag">🔍</span><div class="n">${st.discs_today||0}</div><div class="l">today</div></div>
      <div class="big clik" onclick="drill('week')"><span class="mag">🔍</span><div class="n">${st.discs_week||0}</div><div class="l">this week</div></div>
      <div class="big clik" onclick="drill('month')"><span class="mag">🔍</span><div class="n">${st.discs_month||0}</div><div class="l">this month</div></div>
      <div class="big clik" onclick="drill('alltime')"><span class="mag">🔍</span><div class="n">${st.discs_alltime||0}</div><div class="l">all time (logged)</div></div>
    </div>
    <h2>Drives</h2>
    <div class="cards">${d.drives.map(dr=>dr.online?`<div class="stat"><div class="l">${dr.label}</div><div class="n" style="font-size:22px">${dr.used_gb} / ${dr.total_gb} GB</div>${bar(dr.pct)}<div class="l">${dr.pct}% used</div></div>`:`<div class="stat"><div class="l">${dr.label}</div><div class="muted">offline</div></div>`).join('')}</div>
    <h2>Discs we need from you (${d.discs_needed.length})</h2>
    ${d.discs_needed.length?`<ul class="plain">${d.discs_needed.map(x=>`<li>${x}</li>`).join('')}</ul>`:`<p class="muted">Nothing needed right now. 🎉</p>`}`;
  // My Queue
  loadQueue();
  // Wrestling — collapsible pipeline stages
  document.getElementById('wrestling').innerHTML=`
    ${gauge('Wrestling backlog on Claude&#39;s plate', (wl.wrestling||1), (c.Purchased||0)+' sets still to rip · '+w.total_matches+' matches cut so far')}
    <div class="hero">
      <div class="big"><div class="n">${w.total_matches}</div><div class="l">matches cut &amp; filed</div></div>
      <div class="big"><div class="n">${w.total_sets}</div><div class="l">sets tracked</div></div>
      <div class="big"><div class="n">${c.Purchased||0}</div><div class="l">still to rip</div></div>
      <div class="big"><div class="n">${(c.Ripped||0)+(c.Scanned||0)}</div><div class="l">in the cutting queue</div></div>
    </div>
    <h2>Pipeline — tap a stage to open it</h2>
    ${order.map(stage=>{
      const items=w.sets.filter(s=>s.stage===stage);
      const open=items.length>0 && items.length<=20;
      return `<div class="acc${open?' open':''}"><h4 onclick="this.parentElement.classList.toggle('open')"><span>${stage}</span><span class="r"><span class="cnt${items.length?'':' zero'}">${items.length}</span><span class="arw">▶</span></span></h4><div class="body">${items.map(s=>`<div class="set"><div class="rip">#${s.rip}</div>${s.name}${s.matches?`<div class="mt">${s.matches} matches</div>`:''}</div>`).join('')||'<div class="muted" style="font-size:12px">nothing here yet</div>'}</div></div>`;
    }).join('')}`;
}
const MARK={done:'✓',prog:'◐',queued:'○',you:'✋',flagged:'⚠'};
async function loadQueue(){
  let q; try{ q=await (await fetch('work-queue.json?_='+Date.now())).json(); }catch(e){
    document.getElementById('queue').innerHTML='<p class="muted">Queue file not found.</p>'; return; }
  const groups=(q.groups||[]).map(g=>`
    <div class="qgroup"><h3>${g.title}</h3>
      <ul class="q">${g.items.map(it=>`<li><span class="m s-${it.s}">${MARK[it.s]||'·'}</span>${it.t}</li>`).join('')}</ul>
    </div>`).join('');
  document.getElementById('queue').innerHTML=`
    ${q.now?`<div class="now"><b>Right now:</b> ${q.now}</div>`:''}
    <p class="legend"><span class="s-done">✓ done</span><span class="s-prog">◐ in progress</span><span class="s-queued">○ queued</span><span class="s-you">✋ needs you</span><span class="s-flagged">⚠ flagged</span></p>
    ${groups}
    <p class="muted" style="margin-top:18px">Queue updated ${q.generated||''}</p>`;
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');document.getElementById(b.dataset.tab).classList.add('on');
});
setInterval(()=>{ if(document.getElementById('gate').style.display==='none') load(); }, 30000);
</script>
</body></html>
